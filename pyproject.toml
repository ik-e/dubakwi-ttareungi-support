[project]
name = "ttareungi-support"
version = "0.1.0"
description = "Team tooling for the Ttareungi citizen support workflow MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord-py>=2.6,<2.7",
]

[project.optional-dependencies]
records = [
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tmp", "dist", "data", "docs", "scripts/research"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
