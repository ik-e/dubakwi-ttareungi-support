name: dubakwi-user-supply

services:
  user-api:
    build:
      context: ..
      dockerfile: services/user_api/Dockerfile
    restart: unless-stopped
    environment:
      DUBAKWI_USERS_FILE: /app/data/users.json
      DUBAKWI_RECORDS_FILE: /app/data/records.json
      DUBAKWI_INTERNAL_KEY_FILE: /run/secrets/dubakwi_internal_key
      DUBAKWI_USER_API_PORT: "8801"
    secrets:
      - dubakwi_internal_key
    networks:
      n8n-existing:
        aliases:
          - dubakwi-user-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8801/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

networks:
  n8n-existing:
    external: true
    name: ${DUBAKWI_N8N_NETWORK:?Set the verified existing n8n network}

secrets:
  dubakwi_internal_key:
    file: ${DUBAKWI_INTERNAL_KEY_FILE:?Set the private X-Internal-Key file}
