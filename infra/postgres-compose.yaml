name: dubakwi-storage

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:e8a07d2c7579b038938cdba6c539e580e5001caf9ea203d397b5cc83e76bd938
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      - service-data:/var/lib/postgresql/data
    secrets:
      - postgres_bootstrap_password
      - postgres_owner_password
      - postgres_runtime_password
    networks:
      n8n-existing:
        aliases:
          - dubakwi-postgres
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  service-data:
    external: true
    name: ${DUBAKWI_POSTGRES_DATA_VOLUME:?Set a dedicated external PostgreSQL volume}

networks:
  n8n-existing:
    external: true
    name: ${DUBAKWI_POSTGRES_N8N_NETWORK:?Set the verified existing n8n network}

secrets:
  postgres_bootstrap_password:
    file: ${DUBAKWI_POSTGRES_BOOTSTRAP_PASSWORD_FILE:?Set an absolute private bootstrap password file}
  postgres_owner_password:
    file: ${DUBAKWI_POSTGRES_OWNER_PASSWORD_FILE:?Set an absolute private owner password file}
  postgres_runtime_password:
    file: ${DUBAKWI_POSTGRES_RUNTIME_PASSWORD_FILE:?Set an absolute private runtime password file}
